version: 2

seeds:
  - name: ref_variables
    description: >
      One row per variable in the extracts, with the export's label and question text.
      Generated by source/pipeline/build_reference_seeds.py; do not edit by hand.
    columns:
      - name: variable_name
        description: GSS variable name, lowercase as in the extracts (e.g. postlife).
        data_tests:
          - not_null
          - unique
      - name: label
        description: The export's short description of the variable.
      - name: question_text
        description: The question wording from the export, where it supplies one (often empty).

  - name: ref_codes
    description: >
      One row per variable and code, with the export's label and the response type:
      "answer" or the kind of special missing value. Generated by
      source/pipeline/build_reference_seeds.py; do not edit by hand.
    columns:
      - name: variable_name
        description: GSS variable the code belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('ref_variables')
                field: variable_name
      - name: code
        description: Numeric code from the export. Special missing values use negative codes (-100 to -40).
        data_tests:
          - not_null
      - name: label
        description: >
          The label as it appears in the extracts (e.g. "Every day", ".i:  Inapplicable").
          Models join on it, because the extracts carry labels, not codes.
        data_tests:
          - not_null
      - name: response_type
        description: >
          "answer" for a genuine answer, otherwise the kind of missing value
          (inapplicable, dont_know, no_answer, skipped_on_web, unavailable_that_year, ...).
        data_tests:
          - not_null
      - name: missing_code_letter
        description: The GSS special-missing letter (i, n, d, s, y, ...); empty for a genuine answer.

  - name: ref_variable_validity
    description: >
      Where each variable is valid: one row per variable, survey year and ballot. is_asked is
      observed from the extracts (at least one real answer there), because the export carries
      no questionnaire design; the GSS questionnaires are the authority. Observed coverage
      does not prove questionnaire assignment, so the not_asked_on_ballot classification built
      from it is derived and unverified. Used to tell "not on this ballot" apart from "did not
      apply", which share the code ".i". Generated by
      source/pipeline/build_reference_seeds.py; do not edit by hand. A duplicate row would
      multiply rows in int_gss__responses_long, which assert_row_counts_hold_through_layers catches.
    columns:
      - name: variable_name
        description: GSS variable name.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('ref_variables')
                field: variable_name
      - name: survey_year
        description: Survey year.
        data_tests:
          - not_null
      - name: ballot
        description: Questionnaire ballot (Ballot a, b or c).
        data_tests:
          - not_null
      - name: is_asked
        description: True when at least one respondent on this ballot gave a real answer in this year (observed, not read from the questionnaire).
        data_tests:
          - not_null
