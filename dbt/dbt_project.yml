name: gss_pipeline
version: "1.0.0"
config-version: 2

profile: gss

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

# Settings that belong to the data, not the code. Answer columns come from the staging model;
# numeric_variables are the ones whose real answers are numbers that ref_codes does not list.
vars:
  answer_variables: [wrkstat, evwork, indus10, age, educ, sex, region, relig, attend, reliten,
                     postlife, pray, relig16, satjob, news, tvhours, wwwhr, inttech]
  numeric_variables: [age, tvhours, wwwhr]

# Layers from docs/design_note.md: staging and intermediate are views, marts are tables.
models:
  gss_pipeline:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  gss_pipeline:
    +schema: reference
    ref_variables:
      +column_types:
        variable_name: varchar
        label: varchar
        question_text: varchar
    ref_codes:
      +column_types:
        variable_name: varchar
        code: integer
        label: varchar
        response_type: varchar
        missing_code_letter: varchar
    ref_variable_validity:
      +column_types:
        variable_name: varchar
        survey_year: integer
        ballot: varchar
        is_asked: boolean
