version: 2

models:
  - name: stg_gss__respondents
    description: >
      One row per distinct respondent-year (survey_year, respondent_id). A respondent-year
      present in both extracts is kept once. Survey answers are text as received, including
      special missing codes; they are classified in the intermediate layer.
    columns:
      - name: respondent_year_id
        description: Text key "<survey_year>-<respondent_id>", unique per respondent-year.
        data_tests:
          - not_null
          - unique
      - name: survey_year
        description: Survey year (integer).
        data_tests:
          - not_null
      - name: respondent_id
        description: Respondent id within a survey year (integer); repeats every year.
        data_tests:
          - not_null
      - name: ballot
        description: Questionnaire ballot the respondent was asked.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Ballot a', 'Ballot b', 'Ballot c']
      - name: weight
        description: Survey weight (wtssnrps). Each analysis states whether its figures are weighted.
        data_tests:
          - not_null
      - name: extract_count
        description: How many extracts contained this respondent-year (1 or 2 here).
        data_tests:
          - not_null
      - name: wrkstat
        description: >
          One column per variable in the answer_variables setting (dbt_project.yml), from
          wrkstat to inttech. Each holds the answer label exactly as received, special missing
          codes included; int_gss__responses_long classifies them. Only wrkstat is listed here
          because the others follow the same rule; ref_variables describes each variable.
